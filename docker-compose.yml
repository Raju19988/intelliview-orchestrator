version: '3.8'

# Global Logging Defaults applied to all containers to restrict file size
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - REDIS_REPLICATION_MODE=master
      - MALLOC_CONF=lg_dirty_mult:8
    volumes:
      - redis_data:/data
    networks:
      - ai-interview-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    <<: *default-logging

  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: ai-interview-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_interview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-interview-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    <<: *default-logging

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interview-fastapi
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_interview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      API_TOKEN: "${API_TOKEN:-dev-token-change-me}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-1000}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      ENABLE_PROMETHEUS: "${ENABLE_PROMETHEUS:-true}"
      AUDIT_LOG_FILE: "${AUDIT_LOG_FILE:-}"
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ai-interview-network
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"
        ]
      interval: 20s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    <<: *default-logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interview-worker
    ports:
      - "9101:9101"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_interview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      API_URL: "http://fastapi:8000"
      API_TOKEN: ${API_TOKEN}
      WORKER_CONCURRENCY: "4"
      WORKER_ID: "${WORKER_ID:-worker-1}"
      CV_SERVICE_URL: http://cv-service:8001
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_healthy
      cv-service:
        condition: service_started
    volumes:
      - .:/app
    networks:
      - ai-interview-network
    command: python -m workers.worker_entrypoint
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "workers.celery_app",
          "inspect",
          "ping"
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"
    <<: *default-logging

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interview-celery-beat
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_interview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - ai-interview-network
    command:
      - celery
      - -A
      - workers.celery_app.celery_app
      - beat
      - --loglevel=info
    restart: unless-stopped
    <<: *default-logging

  cv-service:
    build:
      context: ./cv_service
      dockerfile: Dockerfile
    container_name: ai-interview-cv-service
    ports:
      - "8001:8001"
    networks:
      - ai-interview-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8001/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *default-logging

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interview-flower
    ports:
      - "5555:5555"
    environment:
      REDIS_URL: redis://redis:6379/0
      API_TOKEN: "${API_TOKEN:-dev-token-change-me}"
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_healthy
    working_dir: /app
    networks:
      - ai-interview-network
    command:
      - celery
      - -A
      - workers.celery_app.celery_app
      - flower
      - --url_prefix=flower
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:5555/flower/"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    <<: *default-logging

  celery-exporter:
    image: danihodovic/celery-exporter
    container_name: ai-interview-celery-exporter
    command:
      - --broker-url
      - redis://redis:6379/0
      - --host
      - 0.0.0.0
      - --port
      - "9540"
    ports:
      - "9540:9540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-interview-network
    <<: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-interview-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai-interview-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9090/-/healthy"
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    <<: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: ai-interview-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ai-interview-network
    <<: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ai-interview-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14317:4317"
    networks:
      - ai-interview-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:14269/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    <<: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-interview-frontend
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - ai-interview-network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:3000/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *default-logging

# Required Named Volumes and Networks declaration blocks
volumes:
  redis_data:
  postgres_data:
  sqlite_data:
  prometheus_data:
  grafana_data:

networks:
  ai-interview-network:
    driver: bridge
